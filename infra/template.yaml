AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  SalesCatalog — serverless product catalog.
  Cognito (admin-only, Google federation) + API Gateway HTTP API + Lambda (Python 3.12) +
  DynamoDB (Products, Categories) + S3 (UI, Images) + CloudFront + Route 53.
  Region: us-east-1.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment tag. Used in resource names and tags.

  DomainName:
    Type: String
    Description: >
      Public domain for the UI (e.g. "catalog.example.com").
      A Route 53 hosted zone for the parent domain must already exist.

  ImagesSubdomain:
    Type: String
    Default: images
    Description: >
      Subdomain (label only, no dots) used for the product images CloudFront
      distribution. Combined with DomainName as "<ImagesSubdomain>.<DomainName>".

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing Route 53 Hosted Zone ID where DNS records will be created.

  GoogleClientId:
    Type: String
    Description: Google OAuth 2.0 Client ID used for Cognito federation.

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth 2.0 Client Secret used for Cognito federation.

  AccessTokenValidityMinutes:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440
    Description: Lifetime of Cognito access tokens, in minutes (5–1440).

  IdTokenValidityMinutes:
    Type: Number
    Default: 60
    MinValue: 5
    MaxValue: 1440
    Description: Lifetime of Cognito ID tokens, in minutes (5–1440).

  RefreshTokenValidityDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3650
    Description: Lifetime of Cognito refresh tokens, in days (1–3650).

# ---------------------------------------------------------------------------
# Globals — defaults applied to every SAM resource of the given type.
# ---------------------------------------------------------------------------
Globals:

  Function:
    Runtime: python3.12
    Architectures:
      - arm64                       # cheaper than x86_64 on Lambda
    Timeout: 10                     # seconds; raise per-function if needed
    MemorySize: 256                 # MB; baseline for small Python handlers
    Tracing: Active                 # enable X-Ray
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_SERVICE_NAME: salescatalog
        LOG_LEVEL: INFO
    Tags:
      Project: SalesCatalog
      Environment: !Ref Environment

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # Cognito User Pool
  #
  # Admin-only: self sign-up is disabled. Admins are created by an existing
  # admin (AdminCreateUser) or arrive via the Google identity provider. Any
  # user that successfully signs in is considered an admin by definition.
  # -------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub salescatalog-${Environment}-admins
      # Block self sign-up. Only administrators can create new admin users.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      # Sign-in uses email as the username.
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: "OFF"
      # Standard attributes we want available on every admin profile.
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      DeletionProtection: ACTIVE
      UserPoolTags:
        Project: SalesCatalog
        Environment: !Ref Environment

  # -------------------------------------------------------------------------
  # Cognito User Pool Domain (Hosted UI)
  #
  # Cognito-hosted login page used by the React app. The domain prefix is
  # made unique per-account/region by appending the AWS account id.
  # -------------------------------------------------------------------------
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub salescatalog-${Environment}-${AWS::AccountId}

  # -------------------------------------------------------------------------
  # Google Identity Provider
  #
  # Federates Google sign-in into the User Pool. The attribute mapping
  # copies the Google profile email/name into the corresponding Cognito
  # attributes on first login.
  # -------------------------------------------------------------------------
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "openid email profile"
      AttributeMapping:
        email: email
        name: name

  # -------------------------------------------------------------------------
  # Cognito App Client used by the React UI.
  #
  # - Public SPA client (no client secret).
  # - Authorization Code flow + PKCE via the Hosted UI.
  # - Supports Cognito-native logins AND the Google IdP.
  # - Callback / logout URLs use the configured UI domain.
  # -------------------------------------------------------------------------
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    # DependsOn ensures the Google IdP exists before the client references it.
    DependsOn: GoogleIdentityProvider
    Properties:
      ClientName: !Sub salescatalog-${Environment}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
        - Google
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub https://${DomainName}/auth/callback
        - http://localhost:5173/auth/callback   # local Vite dev server
      LogoutURLs:
        - !Sub https://${DomainName}/
        - http://localhost:5173/
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: !Ref AccessTokenValidityMinutes
      IdTokenValidity: !Ref IdTokenValidityMinutes
      RefreshTokenValidity: !Ref RefreshTokenValidityDays
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # -------------------------------------------------------------------------
  # DynamoDB — Products table
  #
  # Access patterns:
  #   - GetItem  by id                                  (PK lookup)
  #   - Query    by categoryId, sorted by createdAt     (GSI "byCategory")
  #   - Scan     with contains(nameLower, q)            (search by name)
  #
  # Search is intentionally implemented as a Scan + contains() filter.
  # At the expected traffic (~10–20 users/day) this is cheap, simple and
  # avoids the cost of OpenSearch. See docs/ for the rationale.
  #
  # Billing mode PAY_PER_REQUEST: no capacity to provision, no idle cost,
  # generous always-free tier on small workloads.
  # -------------------------------------------------------------------------
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub salescatalog-${Environment}-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: categoryId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byCategory
          KeySchema:
            - AttributeName: categoryId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: SalesCatalog
        - Key: Environment
          Value: !Ref Environment

  # -------------------------------------------------------------------------
  # DynamoDB — Categories table
  #
  # Access patterns:
  #   - GetItem  by id                  (PK lookup)
  #   - Scan     full list              (cheap: small table, low traffic)
  # -------------------------------------------------------------------------
  CategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub salescatalog-${Environment}-categories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: SalesCatalog
        - Key: Environment
          Value: !Ref Environment

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  UserPoolId:
    Description: Cognito User Pool ID.
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool App Client ID used by the React UI.
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  UserPoolDomain:
    Description: Cognito Hosted UI domain (prefix only).
    Value: !Ref UserPoolDomain
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolDomain

  HostedUiBaseUrl:
    Description: Full base URL of the Cognito Hosted UI.
    Value: !Sub https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
    Export:
      Name: !Sub ${AWS::StackName}-HostedUiBaseUrl

  ProductsTableName:
    Description: Name of the DynamoDB Products table.
    Value: !Ref ProductsTable
    Export:
      Name: !Sub ${AWS::StackName}-ProductsTableName

  ProductsTableArn:
    Description: ARN of the DynamoDB Products table.
    Value: !GetAtt ProductsTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ProductsTableArn

  CategoriesTableName:
    Description: Name of the DynamoDB Categories table.
    Value: !Ref CategoriesTable
    Export:
      Name: !Sub ${AWS::StackName}-CategoriesTableName

  CategoriesTableArn:
    Description: ARN of the DynamoDB Categories table.
    Value: !GetAtt CategoriesTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CategoriesTableArn
