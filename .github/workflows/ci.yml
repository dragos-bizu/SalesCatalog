name: CI

# Runs on pull requests targeting main.
# No AWS credentials are used here: lint, build and test only.
on:
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # Backend: Python tests + SAM validate/build
  # -------------------------------------------------------------------------
  backend:
    name: Backend (Python / SAM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest moto "aws-lambda-powertools>=3.0,<4.0" boto3

      - name: Run unit tests
        # The `|| echo` guard keeps CI green until the first tests are added
        # in later steps. Remove once tests exist.
        run: |
          if git ls-files '*_test.py' '*test_*.py' | grep -q .; then
            pytest -q
          else
            echo "No Python tests found yet — skipping."
          fi

      - name: SAM validate (lint)
        working-directory: infra
        run: sam validate --lint

      - name: SAM build
        working-directory: infra
        # No --use-container: the only dependency (aws-lambda-powertools) is
        # pure Python, so a native build produces portable, identical
        # artifacts and avoids slow arm64-on-x86 emulation in CI.
        run: sam build

  # -------------------------------------------------------------------------
  # Frontend: lint + test + build (guarded until ui/ exists)
  # -------------------------------------------------------------------------
  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for UI app
        id: ui
        run: |
          if [ -f ui/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ui/package.json not found — frontend CI skipped."
          fi

      - name: Set up Node.js
        if: steps.ui.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: steps.ui.outputs.exists == 'true'
        working-directory: ui
        run: npm ci

      - name: Lint
        if: steps.ui.outputs.exists == 'true'
        working-directory: ui
        run: npm run lint --if-present

      - name: Test
        if: steps.ui.outputs.exists == 'true'
        working-directory: ui
        run: npm run test --if-present

      - name: Build
        if: steps.ui.outputs.exists == 'true'
        working-directory: ui
        run: npm run build
